name: Publish immutable test fixtures

on:
  push:
    branches: [studio-release]
    paths:
      - tests/OpenPhysical.Biometrics.TestFixtures.Package/**
      - scripts/nuget-fixture-projects.json
      - scripts/nuget-fixture-restore.config
      - .github/workflows/publish-test-fixtures.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: biometrics-fixture-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'OpenPhysical/OpenPhysical.Biometrics' && github.ref == 'refs/heads/studio-release'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      MSBUILDDISABLENODEREUSE: '1'
      SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          lfs: true
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - name: Verify source and fixture provenance
        run: |
          python scripts/assert-package-source.py --source-commit "$SOURCE_COMMIT"
          python scripts/verify-test-fixture-package.py
      - name: Build the source-bound fixture archive
        run: |
          dotnet restore tests/OpenPhysical.Biometrics.TestFixtures.Package/OpenPhysical.Biometrics.TestFixtures.Package.csproj --locked-mode --configfile scripts/nuget-fixture-restore.config
          dotnet pack tests/OpenPhysical.Biometrics.TestFixtures.Package/OpenPhysical.Biometrics.TestFixtures.Package.csproj -c Release --no-restore --output artifacts/fixture-publication -p:ContinuousIntegrationBuild=true -p:RepositoryCommit="$SOURCE_COMMIT" -p:SourceRevisionId="$SOURCE_COMMIT"
          python scripts/assert-package-source.py --source-commit "$SOURCE_COMMIT"
          python scripts/write-nuget-publication-manifest.py --repository OpenPhysical.Biometrics --source-commit "$SOURCE_COMMIT" --catalog scripts/nuget-fixture-projects.json --packages artifacts/fixture-publication --output artifacts/fixture-publication-manifest.json
      - name: Refuse an existing package version
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          python scripts/verify-nuget-publication-receipt.py --manifest artifacts/fixture-publication-manifest.json --preflight
          python scripts/check-nuget-versions-absent.py --manifest artifacts/fixture-publication-manifest.json
      - name: Retain the exact archive and source manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: biometric-fixture-${{ github.sha }}
          path: |
            artifacts/fixture-publication/*.nupkg
            artifacts/fixture-publication-manifest.json
          if-no-files-found: error
          retention-days: 90
      - name: Publish the immutable fixture package
        env:
          NuGetPackageSourceCredentials_openphysical: Username=${{ github.actor }};Password=${{ github.token }}
        run: dotnet nuget push artifacts/fixture-publication/OpenPhysical.Biometrics.TestFixtures.1.0.0-dev.20261116.1.nupkg --source openphysical
      - name: Verify private package linkage and fresh NuGet download
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: >-
          python scripts/verify-nuget-publication-receipt.py
          --manifest artifacts/fixture-publication-manifest.json
          --workspace "$RUNNER_TEMP/fixture-receipt"
          --receipt "$RUNNER_TEMP/publication-receipt.json"
      - name: Retain the package publication receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: biometric-fixture-receipt-${{ github.sha }}
          path: "${{ runner.temp }}/publication-receipt.json"
          if-no-files-found: error
          retention-days: 90
