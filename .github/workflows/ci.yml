name: Biometrics package integration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: biometrics-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  MSBUILDDISABLENODEREUSE: 1
  NuGetPackageSourceCredentials_openphysical: Username=${{ github.actor }};Password=${{ github.token }}

jobs:
  build-and-test:
    name: ${{ matrix.rid }} build and tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, rid: linux-x64, camera_arch: '' }
          - { os: ubuntu-24.04-arm, rid: linux-arm64, camera_arch: '' }
          - { os: macos-15-intel, rid: osx-x64, camera_arch: x86_64 }
          - { os: macos-15, rid: osx-arm64, camera_arch: arm64 }
          - { os: windows-2022, rid: win-x64, camera_arch: '' }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      OPBC_ARCHS: ${{ matrix.camera_arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce Biometrics repository product boundary
        run: python scripts/check-product-boundaries.py --repository . --role biometrics
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Verify frozen test fixture provenance
        run: python scripts/verify-test-fixture-package.py
      - name: Restore locked dependencies from package feeds
        run: dotnet restore OpenPhysical.Biometrics.sln --locked-mode
      - name: Check formatting and repository policy
        run: |
          dotnet tool restore
          dotnet csharpier check .
          python scripts/check-file-size.py
          python scripts/verify-models.py
          python scripts/verify-documentation-gate.py
      - name: Build shared biometric libraries and tests
        run: dotnet build OpenPhysical.Biometrics.sln -c Release --no-restore -m:1 -nr:false -p:UseSharedCompilation=false
      - name: Check built test runtime dependency closure
        run: python scripts/check-product-boundaries.py --repository . --role biometrics --publish-dir tests
      - name: Run all biometric tests
        run: dotnet test OpenPhysical.Biometrics.sln -c Release --no-build --no-restore -m:1 -nr:false --collect:"XPlat Code Coverage" --logger "trx;LogFileName=${{ matrix.rid }}.trx" --results-directory artifacts/test-results/${{ matrix.rid }}
      - name: Retain test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: biometrics-tests-${{ matrix.rid }}
          path: artifacts/test-results/${{ matrix.rid }}/
          if-no-files-found: ignore
